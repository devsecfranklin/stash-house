# PORT 80 :: Default server configuration - REDIRECTS TO HTTPS (PORT 443)
server {
    listen 80;
    index index.html;
    server_name bitsmasher.net www.bitsmasher.net;
    location /.well-known/ {
        allow all;  # Allow all access
        autoindex on;  # Enable directory listing (only if desired)
        try_files $uri $uri/ =404;  # Serve files or return 404
    }

    location / {
        try_files $uri $uri/ =404;
    }

    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name bitsmasher.net www.bitsmasher.net;
    ssl_certificate /etc/letsencrypt/live/www.bitsmasher.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bitsmasher.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location /.well-known/ {
        allow all;
        try_files $uri =404; 
    }

    location / {
      proxy_pass http://178.62.60.55:8080;
      try_files $uri $uri/ =404;
    }
}
