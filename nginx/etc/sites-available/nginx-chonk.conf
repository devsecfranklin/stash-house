server {
    listen 80;
    listen [::]:80;
    server_name chonk.lab.bitsmasher.net; # Specific server name
    return 301 https://$host$request_uri; # Redirect all HTTP to HTTPS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name chonk.lab.bitsmasher.net;
    ssl_certificate /etc/letsencrypt/live/chonk.lab.bitsmasher.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chonk.lab.bitsmasher.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    access_log /var/log/nginx/chonk.lab.bitsmasher.net.access.log;
    error_log /var/log/nginx/chonk.lab.bitsmasher.net.error.log error;
}
