# Default Catch-All (Optional, Recommended for Security)
server {
    listen 80 default_server; # Captures unmatched HTTP requests (even if redirected above)
    listen [::]:80 default_server;

    server_name bitsmasher.net; # Catch-all server name
    # return 444;      # Close connection without sending a response (more secure than 404)
    # Alternatively, redirect to a default error page or another domain:
    return 301 https://bitsmasher.net;
}

# HTTPS Server (Port 443) for www.bitsmasher.net
server {
    listen 443 ssl;
    # listen [::]:443 ssl ipv6only=on;

    server_name bitsmasher.net;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/www.bitsmasher.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bitsmasher.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # Recommended security settings
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging (Optional, but good practice)
    access_log /var/log/nginx/www.bitsmasher.net.access.log;
    error_log /var/log/nginx/www.bitsmasher.net.error.log warn;

    # Disable .htaccess and other hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Reverse Proxy Configuration -> shift them to our GoLang site
    location / {
        proxy_pass http://178.62.60.55:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Pass the original protocol (http/https)
    }
}
