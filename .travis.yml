dist: trusty
sudo: false

branches:
  only:
    - master

  env:
    # This environment variable tells Terraform not to prompt for input. This is
    # not required, but if we make a mistake, the Travis builder will hang waiting
    # for user input, tieing up unnecessary resources.
    - TF_INPUT=false

# Install terraform
before_install:
  - curl -sLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/0.12.12/terraform_0.12.12_linux_amd64.zip
  - unzip /tmp/terraform.zip -d /tmp
  - mv /tmp/terraform ~/bin
  - export PATH="~/bin:$PATH"

script: terraform plan ./terraform

deploy:
- provider: script
  skip_cleanup: true
  # var.do_token
  #  Enter a value: 
  #script: terraform apply ./terraform
  script: echo "soon"
  on:
    branch: master
